        }
        function linkIcon() {
            return `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3H3a1 1 0 00-1 1v9a1 1 0 001 1h9a1 1 0 001-1v-3M10 2h4m0 0v4m0-4L6 10"/></svg>`;
        }

        function escapeHtml(v) {
            return String(v || '').replace(/[&<>"']/g, function (s) {
                return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[s];
            });
        }

        function normalizeTag(tag) {
            return String(tag || '').trim().toLowerCase();
        }

        function sortProjects(list) {
            return (Array.isArray(list) ? list.slice() : []).sort(function (a, b) {
                const ay = parseYearLike(a.year || a.date || '');
                const by = parseYearLike(b.year || b.date || '');
                if (ay !== by) return by - ay;
                const an = String(a.name || a.title || '').toLowerCase();
                const bn = String(b.name || b.title || '').toLowerCase();
                return an.localeCompare(bn, 'zh-Hans-CN');
            });
        }

        function normalizeProject(p, index) {
            const tags = Array.isArray(p.tags) ? p.tags
                : Array.isArray(p.topics) ? p.topics
                    : Array.isArray(p.categories) ? p.categories
                        : [];

            const github = p.github || p.repo || p.repository || p.source || (p.links && p.links.github) || '';
            const url = p.url || p.homepage || p.website || p.demo || (p.links && (p.links.main || p.links.demo || p.links.website)) || '';
            const article = p.article || (p.links && (p.links.article || p.links.docs || p.links.doc)) || '';

            return {
                id: index,
                name: p.name || p.title || '未命名项目',
                description: p.description || p.desc || '',
                note: p.note || p.notes || '',
                year: p.year || p.date || '',
                icon: p.icon || p.emoji || '📦',
                logo: p.logo || p.logoUrl || p.logo_url || '',
                tags,
                filterTags: tags.map(normalizeTag),
                language: p.language || p.lang || inferLanguageFromTags(tags),
                status: p.status || p.state || p.phase || 'active',
                stars: p.stars !== undefined ? p.stars : p.stargazers_count,
                forks: p.forks !== undefined ? p.forks : p.forks_count,
                github,
                url,
                article,
                accent: cardAccentColor(tags),
            };
        }

        function statusForSort(s) {
            return statusLabel(s || '').toLowerCase();
        }

        function parseYearLike(v) {
            if (!v) return Number.NEGATIVE_INFINITY;
            const asDate = Date.parse(v);
            if (!Number.isNaN(asDate)) return asDate;
            const m = String(v).match(/\d{4}/);
            if (m) return Number(m[0]);
            return Number.NEGATIVE_INFINITY;
        }

        function compareValues(a, b, key, dir) {
            let va = a[key];
            let vb = b[key];

            if (key === 'year') {
                va = parseYearLike(va);
                vb = parseYearLike(vb);
            } else if (key === 'linkCount') {
                va = Number(va || 0);
                vb = Number(vb || 0);
            } else if (key === 'status') {
                va = statusForSort(va);
                vb = statusForSort(vb);
            } else {
                va = String(va || '').toLowerCase();
                vb = String(vb || '').toLowerCase();
            }

            let result = 0;
            if (typeof va === 'number' && typeof vb === 'number') {
                result = va - vb;
            } else {
                result = String(va).localeCompare(String(vb), 'zh-Hans-CN');
            }
            return dir === 'asc' ? result : -result;
        }

        function cardAccentColor(tags) {
            const colorMap = {
                go: '#00ADD8', rust: '#dea584', python: '#3572A5', javascript: '#f1e05a',
                typescript: '#3178c6', react: '#61dafb', vue: '#41b883', web: '#e44d26',
                tool: '#6c8ebf', blog: '#5bb55b', api: '#9b59b6', cli: '#2c3e50',
                nextjs: '#111111', java: '#b07219', shell: '#89e051', android: '#3DDC84'
            };
            for (const t of (tags || [])) {
                const key = normalizeTag(t);
                if (colorMap[key]) return colorMap[key];
            }
            const defaults = ['#6c8ebf', '#82b366', '#d6a34a', '#a05db5', '#4a90d9'];
            return defaults[Math.abs((tags || []).join('').split('').reduce((a, c) => a + c.charCodeAt(0), 0)) % defaults.length];
        }

        function renderCard(p) {
            const name = p.name;
            const desc = p.description;
            const note = p.note;
            const tags = p.tags;
            const url = p.url;
            const github = p.github;
            const article = p.article;
            const icon = p.icon;
            const logo = p.logo;
            const lang = p.language;
            const status = p.status;
            const accent = p.accent;

            let metaHtml = '';
            if (lang) {
                metaHtml += `<span class="card-meta-item"><span class="lang-dot" style="background:${langColor(lang)}"></span>${lang}</span>`;
            }

            let tagsHtml = tags.map(t =>
                `<span class="card-tag" data-tag="${normalizeTag(t)}">${t}</span>`
            ).join('');

            let linksHtml = '';
            if (github) linksHtml += `<a class="card-link" href="${escapeHtml(github)}" target="_blank" rel="noopener">${githubIcon()} 源码</a>`;
            if (url) linksHtml += `<a class="card-link primary" href="${escapeHtml(url)}" target="_blank" rel="noopener">${linkIcon()} 访问</a>`;
            if (article) linksHtml += `<a class="card-link" href="${escapeHtml(article)}" target="_blank" rel="noopener">📄 文章</a>`;

            let statusHtml = status
                ? `<span class="card-status ${statusClass(status)}">${escapeHtml(statusLabel(status))}</span>`
                : '';

            const tagData = tags.map(normalizeTag).join('|');

            return `
<div class="project-card" data-filter-tags="${tagData}" style="--card-accent:${accent}">
    <div class="card-header">
        <div class="card-icon">${logo ? `<img class="card-logo" src="${escapeHtml(logo)}" alt="${escapeHtml(name)}" loading="lazy">` : escapeHtml(icon)}</div>
        <div class="card-title-wrap">
            <div class="card-name" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
            ${statusHtml}
        </div>
    </div>
    ${desc ? `<div class="card-desc">${escapeHtml(desc)}</div>` : ''}
    ${note ? `<div class="card-note"><strong></strong>${escapeHtml(note)}</div>` : ''}
    ${metaHtml || p.year ? `<div class="card-meta">${metaHtml}${p.year ? `<span class="card-meta-item"><span class="year-badge">${escapeHtml(String(p.year).substring(0, 10))}</span></span>` : ''}</div>` : ''}
    ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
    ${linksHtml ? `<div class="card-footer">${linksHtml}</div>` : ''}
</div>`;
        }

        function renderTableRow(p) {
            const links = [];
            if (p.url) links.push(`<a class="table-link" href="${escapeHtml(p.url)}" target="_blank" rel="noopener">访问</a>`);
            if (p.github) links.push(`<a class="table-link" href="${escapeHtml(p.github)}" target="_blank" rel="noopener">源码</a>`);
            if (p.article) links.push(`<a class="table-link" href="${escapeHtml(p.article)}" target="_blank" rel="noopener">文章</a>`);

            const titleHtml = p.url
                ? `<a class="table-title" href="${escapeHtml(p.url)}" target="_blank" rel="noopener">${escapeHtml(p.name)}</a>`
                : `<span class="table-title">${escapeHtml(p.name)}</span>`;

            const tagsHtml = p.tags.length
                ? `<div class="table-tags">${p.tags.map(function (t) { return `<span class="table-tag">${escapeHtml(t)}</span>`; }).join('')}</div>`
                : '<span class="table-empty-field">-</span>';

            return `
<tr>
    <td>
        <div class="table-name">
            <div class="table-icon">${p.logo ? `<img class="table-logo" src="${escapeHtml(p.logo)}" alt="${escapeHtml(p.name)}" loading="lazy">` : escapeHtml(p.icon)}</div>
            <div class="table-title-wrap">
                ${titleHtml}
                ${p.description ? `<div class="table-desc" title="${escapeHtml(p.description)}">${escapeHtml(p.description)}</div>` : ''}
            </div>
        </div>
    </td>
    <td>${p.year ? `<span class="year-badge">${escapeHtml(String(p.year).substring(0, 10))}</span>` : '-'}</td>
    <td>${p.language ? `<span class="card-meta-item"><span class="lang-dot" style="background:${langColor(p.language)}"></span>${escapeHtml(p.language)}</span>` : '-'}</td>
    <td><span class="card-status ${statusClass(p.status)}">${escapeHtml(statusLabel(p.status))}</span></td>
    <td>${p.note ? `<div class="table-note" title="${escapeHtml(p.note)}">${escapeHtml(p.note)}</div>` : '-'}</td>
    <td>${tagsHtml}</td>
    <td>${links.length ? `<div class="table-links">${links.join('')}</div>` : '-'}</td>
</tr>`;
        }

        function buildFilters(projects) {
            const counts = {};
            const labels = {};
            projects.forEach(p => {
                const tags = p.tags || [];
                tags.forEach(t => {
                    const key = normalizeTag(t);
                    if (!key) return;
                    counts[key] = (counts[key] || 0) + 1;
                    if (!labels[key]) labels[key] = t;
                });
            });
            
            const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
            const bar = document.getElementById('projects-filter');
            sorted.forEach(([tagKey, cnt]) => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.tag = tagKey;
                btn.innerHTML = `${escapeHtml(labels[tagKey] || tagKey)} <span class="tag-count">${cnt}</span>`;
                bar.appendChild(btn);
            });
        }

        function persistView(view) {
            try {
                window.localStorage.setItem(VIEW_STORAGE_KEY, view);
            } catch (_) { }
        }

        function readPersistedView() {
            try {
                const val = window.localStorage.getItem(VIEW_STORAGE_KEY);
                return val === 'table' ? 'table' : 'card';
            } catch (_) {
                return 'card';
            }
        }

        function applyView(state) {
            const toggle = document.getElementById('projects-view-toggle');
            const grid = document.getElementById('projects-grid');
            const tableWrap = document.getElementById('projects-table-wrap');

            toggle.querySelectorAll('.view-btn').forEach(function (b) {
                const active = b.dataset.view === state.view;
                b.classList.toggle('active', active);
                b.setAttribute('aria-selected', String(active));
            });

            if (state.view === 'table') {
                grid.style.display = 'none';
                tableWrap.style.display = 'block';
            } else {
                tableWrap.style.display = 'none';
                grid.style.display = 'grid';
            }
        }

        function attachViewToggle(state) {
            const toggle = document.getElementById('projects-view-toggle');

            applyView(state);

            toggle.addEventListener('click', function (e) {
                const btn = e.target.closest('.view-btn');
                if (!btn) return;
                const nextView = btn.dataset.view;
                if (!nextView || nextView === state.view) return;

                state.view = nextView;
                persistView(nextView);
                applyView(state);
            });
        }

        function applySort(list, state) {
            const sorted = list.slice();
            sorted.sort(function (a, b) {
                const r = compareValues(a, b, state.sort.key, state.sort.dir);
                if (r !== 0) return r;
                return a.id - b.id;
            });
            return sorted;
        }

        function updateSortHeaders(state) {
            const table = document.getElementById('projects-table');
            table.querySelectorAll('th.sortable').forEach(function (th) {
                th.classList.remove('sorted-asc', 'sorted-desc');
                if (th.dataset.sortKey === state.sort.key) {
                    th.classList.add(state.sort.dir === 'asc' ? 'sorted-asc' : 'sorted-desc');
                }
            });
        }

        function attachFilterEvents(state) {
            const bar = document.getElementById('projects-filter');
            const stats = document.getElementById('projects-stats');
            const grid = document.getElementById('projects-grid');
            const tableBody = document.getElementById('projects-table-body');
            const table = document.getElementById('projects-table');

            function filteredList() {
                if (state.activeTag === 'all') return state.projects;
                return state.projects.filter(function (p) {
                    return (p.filterTags || []).includes(state.activeTag);
                });
            }

            function updateStats(visible) {
                stats.innerHTML = `共 <strong>${visible}</strong> / ${state.total} 个项目`;
            }

            function renderByState() {
                const list = filteredList();
                updateStats(list.length);
                grid.innerHTML = list.map(renderCard).join('');

                const tableSorted = applySort(list.map(function (p) {
                    return Object.assign({}, p, { linkCount: [p.url, p.github, p.article].filter(Boolean).length });
                }), state);

                if (!tableSorted.length) {
                    tableBody.innerHTML = '<tr><td class="table-empty" colspan="7">当前筛选条件下没有项目</td></tr>';
                } else {
                    tableBody.innerHTML = tableSorted.map(renderTableRow).join('');
                }
                updateSortHeaders(state);
            }

            renderByState();

            bar.addEventListener('click', e => {
                const btn = e.target.closest('.filter-btn');
                if (!btn) return;
                state.activeTag = btn.dataset.tag;
                bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderByState();
            });

            
            grid.addEventListener('click', e => {
                const chip = e.target.closest('.card-tag');
                if (!chip) return;
                const tag = chip.dataset.tag;
                const target = bar.querySelector(`.filter-btn[data-tag="${tag}"]`);
                if (target) target.click();
            });

            table.addEventListener('click', function (e) {
                const th = e.target.closest('th.sortable');
                if (!th) return;
                const key = th.dataset.sortKey;
                if (!key) return;

                if (state.sort.key === key) {
                    state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
                } else {
                    state.sort.key = key;
                    state.sort.dir = key === 'year' || key === 'linkCount' ? 'desc' : 'asc';
                }
                renderByState();
            });
        }

        function init(projects) {
            const grid = document.getElementById('projects-grid');
            const wrap = document.getElementById('projects-wrap');

            if (!Array.isArray(projects) || projects.length === 0) {
                document.getElementById('projects-loading').style.display = 'none';
                document.getElementById('projects-error').style.display = 'block';
                return;
            }

            
            let list = projects;
            if (!Array.isArray(projects) && projects.projects) list = projects.projects;
            list = sortProjects(list);

            const normalized = list.map(normalizeProject);
            const state = {
                projects: normalized,
                total: normalized.length,
                activeTag: 'all',
                view: readPersistedView(),
                sort: {
                    key: 'year',
                    dir: 'desc',
                },
            };

            buildFilters(normalized);
            attachViewToggle(state);
            attachFilterEvents(state);
            applyView(state);

            document.getElementById('projects-loading').style.display = 'none';
            wrap.style.display = 'block';
        }

        fetch('/projects.json', { cache: 'no-store' })
            .then(r => {
                if (!r.ok) throw new Error('not found');
                return r.json();
            })
            .then(data => {
                
                init(Array.isArray(data) ? data : (data.projects || []));
            })
            .catch(() => {
                document.getElementById('projects-loading').style.display = 'none';
                document.getElementById('projects-error').style.display = 'block';
            });
    }());

    var gcScript = document.querySelector('script[data-goatcounter]');
    if (!gcScript) return;
    var gcBase = gcScript.getAttribute('data-goatcounter').replace(/\/count$/, '');

    
    
    
    function fetchCount(path, onSuccess, onError) {
      var cleanPath = (path || '/').trim();
      if (cleanPath !== '/') cleanPath = cleanPath.replace(/\/+$/, '');
      if (cleanPath && !cleanPath.startsWith('/')) cleanPath = '/' + cleanPath;

      fetch(gcBase + '/counter' + cleanPath + '.json')
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (d) { onSuccess(d.count); })
        .catch(function (e) { if (onError) onError(e); });
    }

    
    document.querySelectorAll('.gc-pv-wrapper[data-gc-path]').forEach(function (wrapper) {
      var path = wrapper.getAttribute('data-gc-path');
      var spinner = wrapper.querySelector('.gc-spinner');
      var countEl = wrapper.querySelector('.gc-pv-count');
      var numEl = wrapper.querySelector('.gc-pv-num');
      if (!path || !countEl || !numEl) return;

      fetchCount(
        path,
        function (count) {
          if (spinner) spinner.style.display = 'none';
          numEl.textContent = count;
          countEl.style.display = 'inline-flex';
        },
        function () {
          wrapper.style.display = 'none';
        }
      );
    });

    
    
    
    
    var totalPath = '/';
    var statsWrap = document.getElementById('gc-site-stats');
    var siteSpinner = document.getElementById('gc-site-spinner');
    var siteCount = document.getElementById('gc-site-count');
    var siteNum = document.getElementById('gc-site-num');

    if (statsWrap && siteNum) {
      fetchCount(
        totalPath,
        function (count) {

          siteNum.textContent = count;
          if (siteCount) siteCount.style.display = 'inline-flex';
          statsWrap.style.display = 'inline-flex';
        },
        function () {
          statsWrap.style.display = 'none';
        }
      );
    }
  })();
