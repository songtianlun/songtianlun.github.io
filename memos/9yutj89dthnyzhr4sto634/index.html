  (function () {
    
    
    var gcScript = document.querySelector('script[data-goatcounter]');
    if (!gcScript) return;
    var gcBase = gcScript.getAttribute('data-goatcounter').replace(/\/count$/, '');

    
    
    
    function fetchCount(path, onSuccess, onError) {
      var cleanPath = (path || '/').trim();
      if (cleanPath !== '/') cleanPath = cleanPath.replace(/\/+$/, '');
      if (cleanPath && !cleanPath.startsWith('/')) cleanPath = '/' + cleanPath;

      fetch(gcBase + '/counter' + cleanPath + '.json')
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (d) { onSuccess(d.count); })
        .catch(function (e) { if (onError) onError(e); });
    }

    
    document.querySelectorAll('.gc-pv-wrapper[data-gc-path]').forEach(function (wrapper) {
      var path = wrapper.getAttribute('data-gc-path');
      var spinner = wrapper.querySelector('.gc-spinner');
      var countEl = wrapper.querySelector('.gc-pv-count');
      var numEl = wrapper.querySelector('.gc-pv-num');
      if (!path || !countEl || !numEl) return;

      fetchCount(
        path,
        function (count) {
          if (spinner) spinner.style.display = 'none';
          numEl.textContent = count;
          countEl.style.display = 'inline-flex';
        },
        function () {
          wrapper.style.display = 'none';
        }
      );
    });

    
    
    
    
    var totalPath = '/';
    var statsWrap = document.getElementById('gc-site-stats');
    var siteSpinner = document.getElementById('gc-site-spinner');
    var siteCount = document.getElementById('gc-site-count');
    var siteNum = document.getElementById('gc-site-num');

    if (statsWrap && siteNum) {
      fetchCount(
        totalPath,
        function (count) {
          if (siteSpinner) siteSpinner.style.display = 'none';
          siteNum.textContent = count;
          if (siteCount) siteCount.style.display = 'inline-flex';
          statsWrap.style.display = 'inline-flex';
        },
        function () {
          statsWrap.style.display = 'none';
        }
      );
    }
  })();
